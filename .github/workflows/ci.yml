name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.82.0", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Set up Python 3.12 for PyO3 workspace check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      - name: Run workspace test suite (no-default-features)
        run: cargo test --workspace --no-default-features

      - name: Check examples
        run: cargo check --no-default-features --examples

      - name: Check HTTP server crate and root feature
        run: |
          cargo check -p stream-server
          cargo check --no-default-features --features server --bin stream-server

      - name: Check Python bindings feature
        run: cargo check --features python

      - name: Run built-in verification & analytic benchmarks
        if: matrix.rust == 'stable'
        run: |
          cargo run --release --no-default-features --bin stream-cli -- \
            verify -i scenarios/diverge.json --assignment --benchmarks

