[workspace]
resolver = "2"
members = [
    ".",
    "crates/stream-core",
    "crates/stream-cli",
    "crates/stream-server",
    "crates/stream-py",
]
exclude = [
    "scenarios/a47_givors_osm/build",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["Aurélien Clairais <aureclai.dev@gmail.com>"]
repository = "https://github.com/AureClai/stream-pipes-rust"

[workspace.dependencies]
stream-core = { path = "crates/stream-core" }
stream-cli = { path = "crates/stream-cli" }
stream-server = { path = "crates/stream-server" }
stream-py = { path = "crates/stream-py" }

pyo3 = { version = "0.22.0", features = ["extension-module", "abi3-py39"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.6"
geo-types = "0.7"
geojson = "0.24"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
rayon = "1.10"

axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
tower = "0.4"

# Retro-compatible root facade package so existing embedders (`stream_core_rust`),
# CLI commands (`cargo run --bin stream-cli`), benchmarks (`--example bench_runner`),
# and integration tests (`tests/*.rs`) continue working unchanged.
[package]
name = "stream-pipes-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Event-based mesoscopic LWR traffic model with per-lane pipes, class-restricted lanes and built-in verification"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["traffic", "simulation", "kinematic-wave", "lwr", "mesoscopic"]
categories = ["science", "simulation"]
exclude = [
    "/whitepaper",
    "/bench/results",
    "/.venv-bench",
    "/scenarios/ngsim/data",
    "/dist",
    "/target",
]

[lib]
name = "stream_core_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stream-cli"
path = "src/main.rs"

[[bin]]
name = "stream-server"
path = "src/server.rs"
required-features = ["server"]

[dependencies]
stream-core = { workspace = true }
stream-cli = { workspace = true }
stream-server = { workspace = true, optional = true }
stream-py = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
anyhow = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# No default features: the engine is embedded by other crates (the RustGIS
# plugin), which must not pull in the Python extension or HTTP server.
default = []
python = ["dep:pyo3", "dep:stream-py"]
server = ["dep:stream-server"]
